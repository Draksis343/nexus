<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXUS ARENA</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d10;--p1:#1c2228;--side:#101419;--text:#eef0ec;--p2:color-mix(in srgb,var(--p1) 55%,var(--bg));--line:#343c43;--muted:#a3adb5;--amber:#ffc266;--cyan:#73dbe4;--red:#ff7772}
*{box-sizing:border-box}body{margin:0;font-family:'Fira Sans',sans-serif;color:var(--text);background:var(--bg)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,#ffffff04 4px),radial-gradient(circle at 86% 5%,color-mix(in srgb,var(--amber) 7%,transparent),transparent 35%);z-index:-1}
button,input,select,textarea{font:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.mono{font-family:'Space Mono',monospace}.muted,.subtle{color:var(--muted)}.subtle{font-size:12px}.amber{color:var(--amber)}.cyan{color:var(--cyan)}.red{color:var(--red)}.hidden{display:none!important}
.sidebar{width:248px;position:fixed;inset:0 auto 0 0;background:var(--side);border-right:1px solid var(--line);z-index:30;display:flex;flex-direction:column;padding:25px 16px;overflow:auto}
.brand{display:flex;gap:12px;align-items:center;padding:5px 9px 24px;border-bottom:1px solid var(--line)}
.mark{width:34px;height:34px;border:2px solid #ffc266;transform:rotate(45deg);display:grid;place-items:center;flex:none}.mark:after{content:"";width:14px;height:14px;border:2px solid #73dbe4;border-radius:50%}
.nav{width:100%;display:block;padding:12px 14px;margin:3px 0;border:1px solid transparent;color:#b5bec4;background:transparent;text-align:left}
.nav:hover,.nav.active{color:#fff;background:color-mix(in srgb,var(--amber) 8%,transparent);border-color:color-mix(in srgb,var(--amber) 33%,transparent)}.nav.active{box-shadow:inset 3px 0 var(--amber)}
.side-b{margin-top:auto;border-top:1px solid var(--line);padding-top:18px;display:grid;gap:8px}
.main{margin-left:248px;padding:34px clamp(18px,3vw,48px) 65px;max-width:1800px}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--amber);margin:0 0 6px}
h1,h2,h3,p{margin-top:0}h1{font-family:'Space Mono',monospace;letter-spacing:-.06em;margin-bottom:8px}h2{font-size:18px}.section-title{font-family:'Space Mono',monospace;text-transform:uppercase;font-size:14px;margin:0 0 14px}
.topline{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}
.panel{background:linear-gradient(135deg,var(--p1),var(--p2) 78%);border:1px solid var(--line);box-shadow:0 16px 35px #0005;position:relative}
.panel:after{content:"";position:absolute;top:-1px;right:-1px;border-top:12px solid var(--bg);border-left:12px solid transparent;pointer-events:none}
.pad{padding:22px}.hero{padding:28px 30px;background:linear-gradient(110deg,color-mix(in srgb,var(--amber) 9%,var(--p2)),var(--p2) 65%,color-mix(in srgb,var(--cyan) 8%,var(--p2)));border-color:color-mix(in srgb,var(--amber) 45%,var(--line))}
.grid-main{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(260px,.85fr);gap:18px}.stack{display:grid;gap:14px;align-content:start}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.mt{margin-top:18px}.mb{margin-bottom:16px}.fl{display:flex;align-items:center;gap:14px}
.badge{display:inline-block;border:1px solid currentColor;padding:5px 8px;font-size:10px;letter-spacing:.1em;font-weight:700;text-transform:uppercase;white-space:nowrap}.badge.muted{color:var(--muted)}.badge.amber{color:var(--amber)}.badge.cyan{color:var(--cyan)}.badge.red{color:var(--red)}
.btn{border:1px solid color-mix(in srgb,var(--amber) 70%,#000);background:var(--amber);color:#181713;padding:11px 16px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:12px}
.btn:hover{box-shadow:0 4px 20px color-mix(in srgb,var(--amber) 25%,transparent)}.btn.secondary{background:var(--p1);color:var(--text);border-color:var(--line)}.btn.ghost{background:transparent;color:var(--muted);border-color:var(--line)}.btn.small{padding:8px 11px;font-size:11px}.btn.danger{background:transparent;color:var(--red);border-color:var(--red)}
.progress{height:7px;background:#343a3d;overflow:hidden}.progress>span{display:block;height:100%;background:linear-gradient(90deg,color-mix(in srgb,var(--amber) 70%,#000),var(--amber))}
.big{font-family:'Space Mono',monospace;font-size:clamp(24px,3vw,40px);letter-spacing:-.06em;margin:0}.cd{font-size:clamp(25px,3vw,40px)}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:16px}.stat small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}.stat strong{font-family:'Space Mono';font-size:22px;display:block;color:var(--amber);margin-top:8px}
.avatar{width:38px;height:38px;flex:none;display:grid;place-items:center;border:1px solid var(--cyan);color:var(--cyan);background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--cyan) 14%,var(--p2)),color-mix(in srgb,var(--cyan) 14%,var(--p2)) 5px,color-mix(in srgb,var(--cyan) 22%,var(--p2)) 6px);font-family:'Space Mono';font-weight:700}.avatar.lg{width:80px;height:80px;font-size:36px;border-width:2px}
.line{display:grid;grid-template-columns:26px 38px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #ffffff13}.line:last-child,.rrow:last-child{border:0}
.card-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{padding:19px;display:flex;flex-direction:column;gap:10px;text-align:left;color:inherit;width:100%;min-height:150px}.card:hover,.card.sel{border-color:var(--amber)}.card h3{font-family:'Space Mono';letter-spacing:-.04em;margin:0}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 18px}.tab{white-space:nowrap;background:var(--p1);color:var(--muted);border:1px solid var(--line);padding:10px 14px;font-size:12px;font-weight:700}.tab.active{color:#151617;background:var(--amber);border-color:var(--amber)}
table{width:100%;border-collapse:collapse;white-space:nowrap;text-align:left}th{color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase;background:var(--p1)}th,td{padding:13px;border-bottom:1px solid var(--line)}.tw{overflow:auto}
.rrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid #ffffff13}
.mg{display:flex;gap:5px;flex-wrap:wrap}.mbtn{background:var(--p2);border:1px solid var(--line);color:var(--c);padding:6px 9px;font-size:11px;font-weight:700}.mbtn:hover{border-color:var(--c)}.mbtn.on{background:var(--c);color:#111}
.empty{padding:28px;text-align:center;color:var(--muted)}.vs{font-family:'Space Mono';font-size:17px}
.field{width:100%;background:var(--p2);color:var(--text);border:1px solid #4d5960;padding:10px 12px;min-height:43px;margin-top:5px}
.modal{position:fixed;inset:0;background:#000c;z-index:50;display:grid;place-items:center;padding:16px;overflow:auto}.modal form{width:min(520px,100%);padding:24px;background:var(--p2)}.modal label{display:block;margin-bottom:12px;font-size:12px;color:var(--muted)}
.toast{position:fixed;right:20px;bottom:20px;z-index:60;background:var(--p1);border:1px solid var(--cyan);padding:13px 18px;max-width:340px}
.badge.nexus{color:transparent;background:linear-gradient(90deg,#aab2b9,#f0c75e);-webkit-background-clip:text;background-clip:text;border-color:#c9b37a}
.cdw{display:flex;gap:16px}.cdb{text-align:center}.cdb b{display:block;font-family:'Space Mono';font-size:clamp(25px,3vw,40px);color:var(--amber)}.cdb i{font-style:normal;font-size:10px;letter-spacing:.14em;color:var(--muted)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.vid{display:flex;gap:10px;align-items:center;margin-bottom:12px}.vid a{display:flex;gap:12px;align-items:center;color:inherit;text-decoration:none;flex:1;min-width:0}.vid a:hover .t{color:var(--amber)}
.vid img,.vid .ph{width:128px;aspect-ratio:16/9;object-fit:cover;flex:none;border:1px solid var(--line);background:var(--p2);display:grid;place-items:center;color:var(--amber);font-size:22px}.vid .t{font-weight:700;overflow:hidden}
.ach{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--c);padding:6px 10px;background:#ffffff06}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:35}
.frost .panel{box-shadow:0 16px 35px #0005,inset 0 1px 0 #ffffff55,inset 0 0 26px #bfe6ff14}
.frost .panel:before{content:"";position:absolute;left:0;right:0;top:0;height:13px;pointer-events:none;border-radius:3px 3px 0 0;background:radial-gradient(circle at 9px 0,#ffffffd9 5px,transparent 6px) 0 0/19px 13px repeat-x,radial-gradient(circle at 14px 0,#e6f4ffb3 4px,transparent 5px) 0 0/27px 10px repeat-x,linear-gradient(#ffffffcc,#ffffffcc) 0 0/100% 2px no-repeat}
.span{grid-column:1/-1}.cdb b.red{color:var(--red)}
.mobile-bar,.scrim{display:none}
@media(max-width:1100px){.card-grid{grid-template-columns:repeat(2,1fr)}.stat-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.sidebar{transform:translateX(-100%);transition:transform .2s}.sidebar.open{transform:none}.scrim.open{display:block;position:fixed;inset:0;background:#000b;z-index:25}.mobile-bar{display:flex;justify-content:space-between;align-items:center;background:var(--side);border-bottom:1px solid var(--line);padding:13px 18px}.mobile-bar button{background:transparent;border:1px solid var(--line);color:#fff;padding:8px 12px}.main{margin:0;padding:25px 18px 60px}.grid-main{grid-template-columns:1fr}}
@media(max-width:900px){.g2{grid-template-columns:1fr}}
@media(max-width:560px){.card-grid{grid-template-columns:1fr}.hero{padding:20px}}
</style></head>
<body>
<header class="mobile-bar"><strong class="mono" style="color:#ffc266">NEXUS ARENA</strong><button id="menu" aria-label="Menú">☰</button></header>
<canvas id="fx"></canvas>
<div id="scrim" class="scrim"></div>
<aside id="sidebar" class="sidebar">
 <div class="brand"><div class="mark"></div><strong class="mono" style="color:#ffc266">NEXUS<br>ARENA</strong></div>
 <nav id="nav" style="margin-top:20px"></nav>
 <div class="side-b" id="side"></div>
</aside>
<main class="main">
 <div class="topline"><div><p class="eyebrow" id="crumb"></p><h1 id="title"></h1><p class="muted" id="sub" style="margin:0"></p></div><span class="badge cyan" id="mode">● SISTEMA ACTIVO</span></div>
 <div id="screen"></div>
</main>
<div id="modal" class="modal hidden"><form id="mform" class="panel"></form></div>
<div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MED={participacion:{n:'Part.',pl:5,xp:15,c:'#a3adb5'},bronce:{n:'Bronce',pl:10,xp:25,c:'#ca906c'},plata:{n:'Plata',pl:20,xp:35,c:'#c6d2da'},oro:{n:'Oro',pl:30,xp:45,c:'#ffc266'},platino:{n:'Platino',pl:40,xp:55,c:'#c7f5f7'}};
const RANKS=[[0,'Recluta'],[200,'Rival'],[500,'Veterano'],[900,'Élite'],[1400,'Maestro'],[2000,'Leyenda']];
const RAR={'Común':{c:'#a3adb5'},Rara:{c:'#5aa9ff'},'Épica':{c:'#b57bff'},Nexus:{c:'#d9b95b'}};
const rc=r=>(RAR[r]||RAR['Común']).c;
const rbadge=r=>r==='Nexus'?'<span class="badge nexus">Nexus</span>':`<span class="badge" style="color:${rc(r)}">${esc(RAR[r]?r:'Común')}</span>`;
const DIFF=['Fácil','Medio','Difícil'];
const DR={Extrema:0,'Difícil':1,Medio:2,'Fácil':3};
const roman=n=>['','I','II','III','IV','V','VI','VII','VIII','IX','X'][n]||String(n);
const cinfo=c=>[c.game,c.category,c.difficulty].filter(Boolean).map(esc).join(' · ');
const ccard=(c,x='')=>`<button class="panel card ${x}" data-a="openc" data-id="${c.id}"><div class="row"><span class="mg">${crar(c)}${c.mode?badge(c.mode,'cyan'):''}</span>${badge(c.status,SC[c.status])}</div><h3>${esc(c.title)}</h3><p class="subtle" style="margin:0">${cinfo(c)}<br>Límite: ${lim(c)}</p><strong class="amber mono" style="margin-top:auto">${40+(c.rarity==='Nexus'?+c.bonus||0:0)} PL MÁX.</strong></button>`;
const arch=a=>D.grants.filter(g=>g.a===a.id).forEach(g=>{const p=D.players.find(x=>x.id===g.p);if(p)(p.hall=p.hall||[]).push({name:a.name,desc:a.desc,rar:a.rar,season:D.season})});
const THEMES={
 original:{bg:'#0b0d10',p1:'#1c2228',side:'#101419',amber:'#ffc266',cyan:'#73dbe4',red:'#ff7772',text:'#eef0ec',fx:'',frost:'0'},
 navidad:{bg:'#08120d',p1:'#17291f',side:'#0c1a13',amber:'#f5c451',cyan:'#86e3a6',red:'#ff5a5f',text:'#f4f7f2',fx:'snow',frost:'1'},
 halloween:{bg:'#0d0a12',p1:'#211829',side:'#120d18',amber:'#ff8a1f',cyan:'#b07cff',red:'#ff4d4d',text:'#f3eef5',fx:'embers',frost:'0'}};
const FX={t:null,raf:0};
function fx(type){type=type||'';if(FX.t===type)return;FX.t=type;cancelAnimationFrame(FX.raf);const c=$('#fx'),g=c.getContext&&c.getContext('2d');c.width=innerWidth;c.height=innerHeight;if(!g)return;g.clearRect(0,0,c.width,c.height);
 if(!type||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 const snow=type==='snow',mk=init=>({x:Math.random()*c.width,y:init?Math.random()*c.height:(snow?-8:c.height+8),r:snow?1+Math.random()*2.6:.8+Math.random()*1.6,v:(snow?1:-1)*(.4+Math.random()*1.1),d:Math.random()*6.28,s:.5+Math.random()}),
 ps=Array.from({length:Math.min(110,Math.floor(innerWidth/10))},()=>mk(true));
 const loop=()=>{g.clearRect(0,0,c.width,c.height);ps.forEach(q=>{q.d+=.012*q.s;q.x+=Math.sin(q.d)*.5;q.y+=q.v;if(snow?q.y>c.height+8:q.y<-8)Object.assign(q,mk(false));g.beginPath();g.arc(q.x,q.y,q.r,0,6.28);g.fillStyle=snow?'rgba(255,255,255,.85)':`rgba(255,${120+Math.floor(q.s*70)},60,.7)`;g.fill()});FX.raf=requestAnimationFrame(loop)};loop()}
function applyTheme(){const t={...THEMES.original,...(D.theme||{})},r=document.documentElement.style;['bg','p1','side','amber','cyan','red','text'].forEach(k=>r.setProperty('--'+k,t[k]));document.body.classList.toggle('frost',t.frost==='1');fx(t.fx)}
function place(){[['#cgrid','#cdet'],['#pgrid','#pdet']].forEach(([g,d])=>{const G=$(g),X=$(d);if(!G||!X)return;const cs=[...G.children].filter(x=>x!==X),i=cs.findIndex(x=>x.classList.contains('sel'));if(i<0)return;const cols=getComputedStyle(G).gridTemplateColumns.split(' ').length||1,t=Math.min(cs.length-1,(Math.floor(i/cols)+1)*cols-1);cs[t].after(X)})}
const C=id=>D.challenges.find(c=>c.id===id);
const nxb=r=>{const c=C(r.c);return c&&c.rarity==='Nexus'&&r.m!=='participacion'?+c.bonus||0:0};
const rpl=r=>MED[r.m].pl+nxb(r);
const duelRes=()=>D.duels.filter(d=>d.m&&dst(d)==='Cumplido'&&MED[d.m]).map(d=>({p:d.b,c:null,m:d.m,at:d.at||0,t:'Reto: '+(d.game||'sin juego')}));
const rname=r=>r.t||cname(r.c);
const crar=c=>c.rarity==='Nexus'?rbadge('Nexus'):badge('Normal','muted');
const ytId=u=>{const m=String(u).match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/);return m&&m[1]};
function bindRarity(){const f=$('#mform'),r=f.elements.rarity,d=f.elements.difficulty;const fn=()=>{const k=d.value;d.innerHTML=(r.value==='Nexus'?[...DIFF,'Extrema']:DIFF).map(x=>`<option ${x===k?'selected':''}>${x}</option>`).join('')};r.onchange=fn;fn()}
const EMPTY=()=>({season:'Temporada 01',players:[],challenges:[],results:[],duels:[],event:null,achs:[],grants:[],videos:[]});
const T={inicio:['INICIO','COMMAND CENTER','Tu centro de operaciones para la liga.'],desafios:['LIGA','DESAFÍOS','Elige una misión. Cada punto cuenta.'],retos:['DUELOS','RETOS','Jugador contra jugador.'],rankings:['CLASIFICACIÓN','RANKINGS','El marcador nunca miente.'],logros:['PROGRESIÓN','LOGROS','Las hazañas dejan huella.'],jugadores:['COMPETIDORES','JUGADORES','Cada leyenda empieza en algún lugar.'],historial:['REGISTRO','HISTORIAL','Cada movimiento, registrado.']};
let D=EMPTY(),A=null,dirty=false,S={page:'inicio',sel:null,psel:null,rtab:'PL'};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const badge=(t,c='amber')=>`<span class="badge ${c}">${esc(t)}</span>`;
const bar=n=>`<div class="progress"><span style="width:${Math.max(0,Math.min(100,n||0))}%"></span></div>`;
const empty=t=>`<div class="panel empty">${t}</div>`;
const adm=h=>A?h:'';
const pname=id=>(D.players.find(p=>p.id===id)||{name:'(eliminado)'}).name;
const cname=id=>(D.challenges.find(c=>c.id===id)||{title:'(eliminado)'}).title;
const stat=(n,l)=>`<div class="panel stat"><small>${l}</small><strong>${n}</strong></div>`;
const fmt=ms=>new Date(ms).toLocaleString('es',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
function toast(t){const e=$('#toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hidden'),5000)}
function touch(){dirty=true;render()}

/* ---------- cálculos ---------- */
function stats(p){const r=[...D.results,...duelRes()].filter(x=>x.p===p.id),s={pl:+p.bonus||0,xp:0,n:{participacion:0,bronce:0,plata:0,oro:0,platino:0},r};
 r.forEach(x=>{const m=MED[x.m];if(m){s.pl+=m.pl+nxb(x);s.xp+=m.xp;s.n[x.m]++}});
 s.xpRaw=s.xp;s.xp=Math.max(0,s.xp-(+p.xpBase||0));s.prest=+p.prestige||0;
 s.medals=s.n.bronce+s.n.plata+s.n.oro+s.n.platino;let k=0;RANKS.forEach((q,i)=>{if(s.xp>=q[0])k=i});
 s.lvl=k;s.rank=RANKS[k][1];s.from=RANKS[k][0];s.next=RANKS[k+1];s.max=k===RANKS.length-1;return s}
function ranking(k='PL'){const L=D.players.map(p=>{const s=stats(p);return{p,s,g:nach(p,s)}});
 const f={PL:(a,b)=>b.s.pl-a.s.pl||b.s.n.platino-a.s.n.platino||b.s.n.oro-a.s.n.oro||b.s.n.plata-a.s.n.plata||b.s.r.length-a.s.r.length,MED:(a,b)=>b.s.medals-a.s.medals||b.s.pl-a.s.pl,XP:(a,b)=>b.s.prest-a.s.prest||b.s.xp-a.s.xp};
 return L.sort(f[k])}
const lim=c=>c.end?fmt(c.end):esc(c.due||'—');
const curEvent=()=>D.challenges.filter(c=>c.rarity==='Nexus'&&c.status!=='Finalizado').sort((a,b)=>(a.end||9e15)-(b.end||9e15))[0];
const left=()=>{const c=curEvent();return c&&c.end?Math.max(0,c.end-Date.now()):0};
const cd=()=>{const ms=left(),s=Math.floor(ms/1000),u=ms<=864e5,v=[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60],l=['DÍAS','HORAS','MIN','SEG'];return v.map((n,i)=>`<span class="cdb"><b class="${u?'red':''}">${String(n).padStart(2,'0')}</b><i>${l[i]}</i></span>`).join('')};
const pct=()=>{const c=curEvent();if(!c||!c.end)return 0;const s=c.start||Date.now();return(Date.now()-s)/(c.end-s)*100};

/* ---------- páginas ---------- */
function hero(){const c=curEvent();
 if(!c)return`<section class="panel hero">${badge('SIN EVENTO NEXUS','cyan')}<h2 class="big mt">Esperando el próximo desafío Nexus</h2><p class="muted">Cuando el admin cree un desafío de rareza Nexus, aparecerá aquí automáticamente con su cuenta regresiva.</p></section>`;
 const st=c.end&&!left()?'Finalizado':c.status==='Disponible'?'En curso':c.status;
 return`<section class="panel hero" style="border-color:#c9b37a"><div class="row"><span class="badge nexus">Evento Nexus</span>${badge(st,'cyan')}</div><p class="eyebrow mt">${esc(c.game)} · ${esc(c.difficulty)}${c.mode?' · '+esc(c.mode):''}</p><h2 class="big">${esc(c.title)}</h2>

 plp(e){const p=D.players.find(x=>x.id===e.id);openForm('Sumar o restar PL',[['d','PL a sumar (usa negativo para restar)*','number']],{d:0},o=>{p.bonus=(+p.bonus||0)+(+o.d||0);touch()})},
 delp(e){if(!confirm('¿Eliminar este jugador con sus resultados y retos?'))return;D.players=D.players.filter(p=>p.id!==e.id);D.results=D.results.filter(r=>r.p!==e.id);D.duels=D.duels.filter(d=>d.a!==e.id&&d.b!==e.id);D.grants=D.grants.filter(g=>g.p!==e.id);D.videos=D.videos.filter(v=>v.p!==e.id);S.psel=null;touch()},
 openp(e){S.psel=S.psel===e.id?null:e.id;render();if(S.psel)$('#pdet')?.scrollIntoView({block:'nearest',behavior:'smooth'})},
 newd(){if(D.players.length<2)return toast('Agrega al menos 2 jugadores primero.');openForm('Nuevo reto',duelF(),{status:'Pendiente'},o=>{D.duels.push({id:uid(),at:Date.now(),...o});touch()})},
 editd(e){const d=D.duels.find(x=>x.id===e.id);openForm('Editar reto',duelF(),d,o=>{Object.assign(d,o);touch()})},
 deld(e){if(!confirm('¿Eliminar este reto?'))return;D.duels=D.duels.filter(d=>d.id!==e.id);touch()},
 newa(){openForm('Nuevo logro',AF,{rar:'Común'},o=>{D.achs.push({id:uid(),...o});touch()})},
 edita(e){const a=D.achs.find(x=>x.id===e.id);openForm('Editar logro',AF,a,o=>{Object.assign(a,o);touch()})},
 dela(e){const a=D.achs.find(x=>x.id===e.id);if(!confirm('¿Eliminar este logro? Los jugadores que lo tienen conservarán su insignia en el perfil.'))return;arch(a);D.achs=D.achs.filter(x=>x.id!==e.id);D.grants=D.grants.filter(g=>g.a!==e.id);touch()},
 clra(){if(!confirm('¿Archivar y eliminar todos los logros personalizados? Cada jugador conserva los que ya ganó.'))return;D.achs.forEach(arch);D.achs=[];D.grants=[];touch()},
 grant(e){const i=D.grants.findIndex(g=>g.p===e.p&&g.a===e.g);if(i>=0)D.grants.splice(i,1);else D.grants.push({p:e.p,a:e.g});touch()},
 addv(e){openForm('Agregar video de reto',[['url','Enlace del video*','url'],['title','Título (vacío = se intenta obtener de YouTube)']],{},async o=>{if(!/^https?:\/\//i.test(o.url))return toast('El enlace debe empezar con http:// o https://');let t=o.title.trim();if(!t){try{const r=await fetch('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent(o.url));if(r.ok)t=(await r.json()).title}catch(x){}}D.videos.push({id:uid(),p:e.id,url:o.url.trim(),title:t||'Video del reto'});touch()})},
 delv(e){D.videos=D.videos.filter(v=>v.id!==e.id);touch()},
 dmedal(e){const d=D.duels.find(x=>x.id===e.id);if(d.m===e.m)d.m='';else{d.m=e.m;d.status='Cumplido';d.at=Date.now()}touch()},
 presti(e){const p=D.players.find(x=>x.id===e.id),s=stats(p);if(!s.max)return toast('Solo se puede ascender al llegar al nivel máximo (Leyenda, 2,000 XP).');if(!confirm('¿Reiniciar la XP de '+p.name+' y activar Prestigio '+roman(s.prest+1)+'?'))return;p.xpBase=s.xpRaw;p.prestige=s.prest+1;touch()},
 randd(){const n=D.players.length;if(n<2)return toast('Agrega al menos 2 jugadores primero.');if(D.duels.length&&!confirm('Ya hay retos en la lista; se agregarán '+n+' más. ¿Continuar?'))return;const ids=D.players.map(p=>p.id);for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}ids.forEach((id,i)=>D.duels.push({id:uid(),at:Date.now(),a:id,b:ids[(i+1)%n],game:'',rules:'',status:'Pendiente',m:''}));touch();toast('Se generaron '+n+' retos. Edita cada uno para poner el juego y las condiciones.')},
 endround(){if(!D.duels.length)return;if(!confirm('¿Cerrar la ronda y borrar la lista de retos? Las medallas ganadas se conservan.'))return;D.results.push(...duelRes());D.duels=[];touch()},
 theme(){openForm('Tema de la interfaz',[['preset','Plantilla (si eliges una, se ignoran los colores de abajo)','select',[['','— Personalizado —'],['original','Original'],['navidad','Navidad ❄'],['halloween','Halloween 🎃']]],['bg','Fondo','color'],['p1','Paneles y tarjetas','color'],['side','Barra lateral','color'],['amber','Acento principal','color'],['cyan','Acento secundario','color'],['red','Alerta (rojo)','color'],['text','Texto','color'],['fx','Partículas de fondo','select',[['','Ninguna'],['snow','Nieve ❄'],['embers','Chispas ✨']]],['frost','Escarcha en los bordes','select',[['0','No'],['1','Sí']]]],{...THEMES.original,...(D.theme||{}),preset:''},o=>{D.theme=o.preset?{...THEMES[o.preset]}:(({preset,...r})=>r)(o);touch()})}
};
const AF=[
  ['name','Nombre del logro*'],
  ['desc','Descripción','area'],
  ['rar','Rareza','select',Object.keys(RAR)]
];

const duelF=()=>[
  ['a','Retador (quien reta)*','select',opts()],
  ['b','Retado (quien cumple el reto)*','select',opts()],
  ['game','Juego del reto*'],
  ['rules','Condiciones (lo que debe cumplir)','area'],
  ['status','¿Lo cumplió?','select',DS],
  ['m','Medalla (si lo cumplió)','select',[
    ['','— Sin medalla —'],
    ...['bronce','plata','oro','platino'].map(k=>[k,MED[k].n])
  ]]
];

document.addEventListener('click',e=>{
  if(e.target.id==='modal')return closeM();

  if(e.target.id==='scrim'||e.target.id==='menu'){
    const o=e.target.id==='menu';
    $('#sidebar').classList.toggle('open',o);
    $('#scrim').classList.toggle('open',o);
    return;
  }

  const b=e.target.closest('[data-a]');
  if(b&&act[b.dataset.a])act[b.dataset.a](b.dataset);
});

window.addEventListener('resize',()=>{
  place();
  const c=$('#fx');
  c.width=innerWidth;
  c.height=innerHeight;
});

setInterval(()=>{
  const c=$('#cd');
  if(c){
    c.innerHTML=cd();
    $('#cdbar').innerHTML=bar(pct());
  }
},1000);

setInterval(async()=>{
  if(!A&&!document.hidden&&!$('#modal').offsetParent){
    const b=JSON.stringify(D);
    await load();
    if(JSON.stringify(D)!==b)render();
  }
},60000);

window.onbeforeunload=e=>{
  if(dirty){
    e.preventDefault();
    return '';
  }
};

(async()=>{
  try{
    const sv=localStorage.getItem('nx_admin');
    if(sv){
      A=JSON.parse(sv);
      await loadAdmin();
    }
  }catch(e){
    A=null;
  }

  if(!A)await load();
  render();
})();
