<style>

.badge.nexus{color:transparent;background:linear-gradient(90deg,#aab2b9,#f0c75e);-webkit-background-clip:text;background-clip:text;border-color:#c9b37a}

.gb{padding:0 22px 20px}.gb p,.gb li{line-height:1.55}.gb ul{margin:6px 0 12px 18px;padding:0}.gb li{margin-bottom:4px}.gb h3{margin:14px 0 6px}

a.btn{display:inline-block;text-decoration:none}.rt a,.gb a{color:var(--cyan);text-decoration:underline}
.news{padding:12px 0;border-bottom:1px solid #ffffff13}.news:last-of-type{border:0}.news img{width:100%;max-height:200px;object-fit:cover;display:block;margin-bottom:10px;border:1px solid var(--line)}.news h3{margin:8px 0 6px;font-size:16px}
details.rec{border:1px solid var(--line);margin-bottom:8px;background:var(--p2)}details.rec>summary{cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;list-style:none}details.rec>summary::-webkit-details-marker{display:none}details.rec .gb{padding:0 14px 14px}
.ttl{margin-left:8px;vertical-align:middle}

.tlx{background:linear-gradient(135deg,#12151a,#1b2026);border:1px solid #ffc266b0;position:relative;overflow:hidden;color:#f2f3ef;box-shadow:0 16px 35px #0006}
@keyframes tlm{to{background-position:calc(100% + 200px) 0}}@keyframes tlp{0%,100%{filter:drop-shadow(0 0 5px #ffc266)}50%{filter:drop-shadow(0 0 16px #ffc266)}}
.tl-ic{width:34px;height:34px;flex:none;display:grid;place-items:center;object-fit:contain;transition:filter .2s,transform .2s}.tl-ic:hover{filter:drop-shadow(0 0 10px #ffc266);transform:scale(1.1)}
.tl-emb{width:20px;height:20px;border:2px solid #ffc266;transform:rotate(45deg);display:grid;place-items:center;box-shadow:0 0 6px #ffc26666}.tl-emb:after{content:"";width:9px;height:9px;border:2px solid #73dbe4;border-radius:50%}
.tl-name{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:1px;color:inherit}.tl-n{font:700 12px 'Space Mono',monospace;color:#ffc266}.tl-s{font:italic 12px 'Fira Sans',sans-serif;color:#73dbe4}.tl-name:hover .tl-n{text-shadow:0 0 8px #ffc266}.tl-name:hover .tl-s{text-shadow:0 0 8px #73dbe4}

.tlv-line i{position:absolute;left:0;right:0;top:0;overflow:hidden}.tlv-line i:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent,#fff9,transparent) 0 -200px/100% 200px no-repeat;animation:tlmv 5s linear infinite}
@keyframes tlmv{to{background-position:0 calc(100% + 200px)}}

.tl-hint{padding:10px 18px 14px;font-size:12px;color:#a3adb5}

.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}.lg{display:flex;gap:10px;padding:10px 12px;align-items:flex-start}

document.addEventListener('input',e=>{if(e.target.id==='tq'){S.tq=e.target.value;$('#tlist').innerHTML=tlist(D.players.find(x=>x.id===S.psel))}if(e.target.id==='pq'){S.pq=e.target.value;S.pn=24;$('#pachl').innerHTML=pachList(D.players.find(x=>x.id===S.psel))}if(e.target.id==='cq'){S.cq=e.target.value;S.cn=15;$('#cdl').innerHTML=pchalList(D.players.find(x=>x.id===S.psel))}if(e.target.id==='rq'){S.rq=e.target.value;const c0=C(S.sel);if(c0)$('#rlist').innerHTML=reslist(c0)}if(e.target.id==='lq'){S.lq=e.target.value;$('#lwrap').innerHTML=lcards()}if(e.target.id==='vol'){AU.vol=+e.target.value/100;localStorage.setItem('nx_vol',AU.vol);if(AU.a){AU.a.volume=AU.vol;if(AU.vol>0&&AU.muted){AU.muted=false;localStorage.setItem('nx_mute','0');AU.a.muted=false;if(AU.a.paused)AU.a.play().catch(()=>{})}}audio()}if(e.target.id==='fq'){S.fq=e.target.value;$('#cwrap').innerHTML=cwrap();place()}});
document.addEventListener('change',e=>{const k=e.target.id;if(['fs','fc','fd','fr','fy'].includes(k)){S[k]=e.target.value;$('#cwrap').innerHTML=cwrap();place()}if(k==='vs'){S.vs=e.target.value;render()}if(['pr','pt'].includes(k)){S[k]=e.target.value;S.pn=24;render()}if(['cm','cy','cse'].includes(k)){S[k]=e.target.value;S.cn=15;render()}if(k==='cmp'){S.cmp=e.target.value;render()}if(k==='tr'){S.tr=e.target.value;$('#tlist').innerHTML=tlist(D.players.find(x=>x.id===S.psel))}if(['lr','lt','ld'].includes(k)){S[k]=e.target.value;$('#lwrap').innerHTML=lcards()}if(k==='rs'){S.rs=e.target.value;render()}});
