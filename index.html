function guia(){const g=(t,b,o)=>`<details class="panel" ${o?'open':''}><summary>${t}</summary><div class="gb">${b}</div></details>`,

 return`<div class="stack">
 <section class="panel pad"><h2 class="section-title">Resumen en 30 segundos</h2><ul style="margin:0 0 0 18px;padding:0;line-height:1.6"><li>Cada semana hay <strong>desafíos nuevos</strong>. Juegas, muestras tu evidencia y el admin te da una <strong>medalla</strong>.</li><li>Las medallas te dan <strong>PL</strong> (para el ranking de la temporada) y <strong>XP</strong> (para subir de rango).</li><li>El <strong>desafío Nexus</strong> es el evento principal: tiene cuenta regresiva y da PL extra.</li><li>No necesitas ser el mejor: participar, superar retos y construir tu trayectoria también cuenta.</li></ul></section>
 ${g('🎮 ¿Cómo participo en un desafío?',`<ul><li>Entra a <strong>Desafíos</strong> y abre el que quieras. Ahí ves la <strong>Misión</strong>, los <strong>Objetivos</strong>, el modo (<em>Solo</em> o <em>Multijugador</em>), la dificultad y la fecha límite.</li><li>Para que tu desafío <strong>cuente</strong>, debes mandar tu <strong>evidencia</strong>: el <strong>enlace de un video subido a YouTube</strong> donde se vea que cumpliste el desafío.</li><li>Entrégale ese enlace al administrador por el medio que usen en la liga. Él revisa el video y te registra la medalla que ganaste.</li><li>Verás tu medalla en tu perfil y tus puntos en los rankings.</li></ul><p class="muted">Participar es voluntario y no hay castigo por faltar a una semana. Puedes intentarlo varias veces: cuenta tu mejor resultado.</p>`,true)}
 ${g('🏅 Medallas, PL y XP',`<p>Cada desafío tiene cuatro niveles de medalla: <strong>Bronce</strong> (cumples el objetivo principal), <strong>Plata</strong>, <strong>Oro</strong> y <strong>Platino</strong> (lo más difícil). Si lo intentas pero no lo logras, recibes una <strong>Participación</strong>. Solo cuenta una medalla por desafío: la mejor.</p>${med}<p class="muted" style="margin-top:10px">Los <strong>PL (puntos de liga)</strong> deciden al campeón de la temporada y se reinician cada temporada. La <strong>XP</strong> y tus medallas se quedan contigo para siempre.</p>`)}
 ${g('💎 Rarezas: Común, Rara, Épica, Nexus, Reliquia y Atemporal',`<p>La rareza te dice qué tan especial es un desafío o un logro.</p><ul><li><strong>Común, Rara y Épica:</strong> son etiquetas de valor; mientras más rara, más especial.</li><li><strong>Nexus:</strong> el desafío principal de la semana. Sale en el Command Center con <strong>cuenta regresiva</strong>. Al completarlo ganas <strong>PL extra</strong> y es el único que puede tener dificultad <em>Extrema</em>.</li><li><strong>Reliquia:</strong> edición limitada. Solo cierta cantidad de jugadores puede conseguirla; cuando se agotan los cupos, nadie más puede.</li><li><strong>Atemporal:</strong> desafíos sin fecha límite, muy difíciles, que pueden pasar de una temporada a otra. No dan PL: dan un título y una Medalla Atemporal.</li></ul>`)}
 ${g('⭐ Rangos y Prestigio',`<p>Con la XP que ganas con tus medallas subes de rango:</p>${rk}<p style="margin-top:10px">Cuando llegas a <strong>Leyenda</strong>, el administrador puede reiniciar tu XP y activarte el <strong>Prestigio I</strong>. Después vendrá el II, el III y así sucesivamente. Tu prestigio aparece como un número romano <span class="prs" style="margin-left:2px">II</span> dorado junto a tu nombre.</p>`)}
 ${g('🥊 Retos entre jugadores',`<p>Un reto es un <strong>"yo te reto a que hagas esto"</strong>: un jugador reta a otro a cumplir algo en un videojuego, con sus condiciones. A veces los retadores se sortean al azar y el administrador define el juego y las condiciones.</p><ul><li>Para validar un reto también necesitas mandar el <strong>enlace de tu video en YouTube</strong> donde se vea que cumpliste las condiciones.</li><li>Si cumples el reto, queda como <strong>Cumplido</strong> y puede darte una medalla (con sus PL y XP).</li><li>Cuando termina la ronda se cierra la lista de retos y se arma una nueva. Las medallas que ganaste se conservan.</li></ul>`)}
 ${g('🏆 Rankings y temporadas',`<p>En <strong>Rankings</strong> hay varias clasificaciones:</p><ul><li><strong>General:</strong> PL de la temporada actual.</li><li><strong>Histórico:</strong> PL de todas las temporadas juntas.</li><li><strong>Coleccionistas:</strong> quién tiene más medallas.</li><li><strong>Experiencia:</strong> quién tiene más XP (el prestigio va primero).</li></ul><p>Si hay empate en PL, gana quien tenga más platinos, luego oros, luego platas. Al terminar una temporada el ranking se guarda, los PL empiezan de cero y el campeón entra al <strong>Salón de la Fama</strong>. Puedes consultar temporadas pasadas con el selector.</p><p class="muted">Cada temporada dura varias rondas. En el Command Center ves en qué ronda vamos y cuántas faltan.</p>`)}
 ${g('🎖️ Logros',`<p>Los logros son insignias que se ganan por hazañas especiales. En la sección <strong>Logros</strong> ves todos y cuántos jugadores los han conseguido. Los tuyos aparecen en tu perfil, en la pestaña <strong>Colección</strong>, y los de temporadas pasadas se quedan ahí. Cuando hay un logro <strong>Reliquia</strong> disponible, lo verás en el Command Center con sus cupos restantes.</p>`)}
 ${g('🎯 Logros del desafío y Sincronía Total',`<p>Algunos desafíos tienen <strong>logros propios</strong>: metas extra dentro del mismo desafío (por ejemplo, "sin recibir daño" o "sin usar objetos"). Cada uno da <strong>PL</strong> aparte de los de tu medalla.</p><p>Si completas <strong>todos</strong> los logros de un desafío y además ganas una medalla (mínimo Bronce), logras la <strong>Sincronía Total</strong>: recibes un PLUS de PL (la mitad de los PL de tu medalla) y un <strong>Sello de Sincronía</strong>. Los sellos se acumulan en tu Colección: uno por cada desafío completado al 100 %.</p>`)}
 ${g('♾️ Desafíos atemporales',`<p>Son desafíos muy difíciles que <strong>no tienen fecha límite</strong> y pueden durar varias temporadas. <strong>No dan PL</strong>, para no alterar el ranking de cada temporada. Su recompensa es un <strong>título</strong> y la <strong>Medalla Atemporal</strong>, que se acumula en tu Colección para que todos vean tu esfuerzo.</p><p class="muted">Cada uno guarda en qué temporada se creó.</p>`)}
 ${g('🕰️ Línea de tiempo',`<p>Es el mapa de todas las temporadas de Nexus Arena: las <strong>pasadas</strong>, la que está <strong>en vivo</strong> (su pin brilla y palpita) y algunos <strong>spoilers</strong> de las que vienen.</p><ul><li>Baja para recorrerla de arriba (el origen) hacia el futuro.</li><li>Toca el nombre de una temporada para abrir su descripción.</li><li>Los spoilers pueden aparecer como "Oculto" hasta que se revelen.</li></ul>`)}
 ${g('🏷️ Títulos',`<p>Algunos logros dan como recompensa un <strong>título</strong> (por ejemplo, "Cazador de Sombras"). Los títulos también tienen rareza: Común, Rara, Épica, Nexus o Reliquia.</p><ul><li>Cuando consigues un logro con título, ese título queda <strong>desbloqueado</strong> en tu perfil, en la pestaña <strong>Títulos</strong>.</li><li>Para usarlo, pídele al administrador que te lo ponga: aparecerá <strong>junto a tu nombre</strong> en los rankings, en tu perfil y en las demás secciones.</li><li>Los títulos que ganaste se quedan contigo aunque el logro se retire al terminar la temporada.</li></ul>`)}
 ${g('👤 Tu perfil',`<p>En <strong>Jugadores</strong> toca tu nombre para abrir tu perfil. Tiene cuatro pestañas:</p><ul><li><strong>Resumen:</strong> tu rango, tu barra de XP, tus puntos, los videos de tus retos y tus últimos 3 desafíos.</li><li><strong>Colección:</strong> tus medallas y tus logros.</li><li><strong>Títulos:</strong> los títulos que has desbloqueado, con buscador y filtro por rareza.</li><li><strong>Historial:</strong> todos los desafíos que has hecho, con su medalla y los PL que te dieron.</li></ul>`)}
${g('👤 Tu cuenta de jugador',`<ul><li>Pulsa <strong>Iniciar sesión</strong> en el menú y crea tu cuenta (usuario, nombre y contraseña).</li><li>El administrador la <strong>activa</strong> y crea tu jugador; hasta entonces no puedes editar tu perfil.</li><li>En <strong>Mi cuenta</strong> cambias tu foto, tu nombre y tu título (solo uno de los que ya ganaste).</li><li>No uses una contraseña que ya uses en otro lado. Si la olvidas, el administrador te pone una nueva.</li></ul>`)}
