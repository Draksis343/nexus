.cc-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.cc-tabs button{padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--p1);color:var(--muted);font:700 12px inherit;cursor:pointer}.cc-tabs button.on{border-color:var(--amber);color:var(--amber);background:color-mix(in srgb,var(--amber) 12%,var(--p1))}
.cc-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;margin-top:10px}.cc-it{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;min-height:150px;padding:30px 8px 10px;border-radius:14px;background:var(--p1);border:1px solid var(--line);color:var(--text);font:inherit;cursor:pointer;overflow:hidden}.cc-it.on{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan)}.cc-it b{font-size:12px;line-height:1.2}.cc-it small{font:10px 'Space Mono',monospace;color:var(--muted)}.cc-it .cc-tg{position:absolute;top:6px;left:6px;display:flex;gap:4px}.cc-tg i{font-style:normal;font:700 9px 'Space Mono',monospace;padding:2px 6px;border-radius:999px;background:#0008;color:var(--muted)}.cc-tg i.nw{color:#0b0d10;background:var(--amber)}
.cc-it .avatar{width:58px;height:58px;font-size:22px;border-radius:50%;margin:10px 0 12px}.ccbd{width:100%;height:64px;border-radius:12px;background:var(--p2);border:1px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--muted)}.cc-it .fbp{width:100%;height:64px}.cc-it canvas{width:100%;height:76px;border-radius:10px;background:#0009}.cc-nm{font:700 17px 'Space Mono',monospace;min-height:64px;display:grid;place-items:center}.cc-em{font-size:30px;min-height:64px;display:grid;place-items:center}
.ccpv{border-radius:18px;margin:4px 0 6px;overflow:hidden}.ccpv .pf-head{margin:0;position:relative;min-height:120px;display:flex;align-items:center;gap:22px;padding:24px 28px}.ccpv .avatar{width:72px;height:72px;font-size:28px;border-radius:50%;flex:none}.ccpv h3{margin:0;font:700 20px 'Space Mono',monospace;position:relative;z-index:1}.ccpv .pfxc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.ccpv .avatar{z-index:1}


/* === Eventos de temporada === */
.evc{border-color:color-mix(in srgb,var(--ec) 70%,var(--line))!important;background:radial-gradient(circle at 88% 0%,color-mix(in srgb,var(--ec) 26%,transparent),transparent 55%),linear-gradient(110deg,color-mix(in srgb,var(--ec) 12%,var(--p2)),var(--p2) 65%)!important;box-shadow:0 0 0 1px color-mix(in srgb,var(--ec) 25%,transparent),0 16px 40px color-mix(in srgb,var(--ec) 18%,#0006)!important}
.evc.kb{background:transparent!important}
.evb{color:var(--ec)!important;border-color:var(--ec)!important;background:color-mix(in srgb,var(--ec) 14%,transparent)}
.evchip{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border-radius:999px;background:#0006;border:1px solid var(--line);font:700 11px 'Space Mono',monospace;white-space:nowrap}
.evbtn{background:var(--ec)!important;border-color:var(--ec)!important;color:#0b0d10!important}
.evc .cdb b{color:var(--ec)}
.evadd{width:100%;padding:22px;border:1px dashed var(--line)!important;background:transparent!important;color:var(--muted);font:700 13px inherit;cursor:pointer;box-shadow:none!important}.evadd:hover{color:var(--amber);border-color:var(--amber)!important}
.evgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:20px;align-items:start}
@media(max-width:900px){.evgrid{grid-template-columns:1fr}}
.evh .big{font-size:clamp(28px,4vw,52px)}
.evac{display:flex;gap:12px;align-items:center;padding:12px 14px;border-left:3px solid var(--pc)!important}.evac.got{background:linear-gradient(90deg,color-mix(in srgb,var(--cyan) 10%,var(--p1)),var(--p1))}
.evst{text-align:right;font-size:12px;white-space:nowrap}
.evpzg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}

function owned(p){const L=[];passMine(p.id).filter(r=>r.type==='titulo').forEach(r=>L.push({name:r.name,rar:r.rar||'Rara',from:'Pase de temporada',season:r.season||'',at:r.at||0}));D.grants.filter(g=>g.p===p.id).forEach(g=>{const a=D.achs.find(x=>x.id===g.a);if(a&&a.title)L.push({name:a.title,rar:a.trar||a.rar,from:a.name,season:'',at:g.at||0})});(p.hall||[]).forEach(x=>{if(x.title)L.push({name:x.title,rar:x.trar||x.rar,from:x.name,season:x.season||'',at:x.at||0})});D.atem.filter(x=>x.p===p.id&&x.tt).forEach(x=>L.push({name:x.tt,rar:x.trar||'Atemporal',from:x.t,season:x.cs||'',at:x.at||0}));const seen=new Set();return L.filter(t=>{const k=t.name+'|'+t.rar;if(seen.has(k))return false;seen.add(k);return true})}
